name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Market Data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      changed_titles: ${{ steps.changed-titles.outputs.titles }}
      line_payload: ${{ steps.line-payload.outputs.payload }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Extract titles from changed content files
        id: changed-titles
        run: |
          TITLES=""
          while IFS= read -r file; do
            if [[ "$file" =~ \.(md|mdx)$ ]] && [ -f "$file" ]; then
              TITLE=$(grep -m1 "^title:" "$file" | sed "s/^title: *//" | tr -d "\"'")
              if [ -n "$TITLE" ]; then
                TITLES="${TITLES}• ${TITLE}"$'\n'
              fi
            fi
          done < <(git diff --name-only HEAD~1 HEAD)
          {
            echo "titles<<EOF"
            printf "%s" "$TITLES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build LINE notification payload
        id: line-payload
        run: |
          python3 - <<'PYEOF'
          import os, json, subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"], text=True
          ).splitlines()

          articles = []
          for f in changed:
              if not (f.endswith(".md") or f.endswith(".mdx")):
                  continue
              if not f.startswith("src/content/notes/投資/"):
                  continue
              if not os.path.isfile(f):
                  continue
              title, desc = "", ""
              with open(f, encoding="utf-8") as fp:
                  for line in fp:
                      line = line.rstrip()
                      if line == "---" and title:
                          break
                      if line.startswith("title:") and not title:
                          title = line[6:].strip().strip("\"'")
                      if line.startswith("description:") and not desc:
                          desc = line[12:].strip().strip("\"'")
              if not title:
                  continue
              slug = f.removeprefix("src/content/notes/").rsplit(".", 1)[0]
              url = f"https://bargisula.github.io/notes/{slug}"
              articles.append({"title": title, "desc": desc, "url": url})

          if not articles:
              payload = ""
          else:
              lines = ["📊 新投資報告\n"]
              for a in articles:
                  lines.append(a["title"])
                  if a["desc"]:
                      lines.append(a["desc"])
                  lines.append(a["url"])
                  lines.append("")
              payload = "\n".join(lines).strip()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"payload<<EOF\n{payload}\nEOF\n")
          PYEOF
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Astro
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify via ntfy
        run: |
          TITLES="${{ needs.build.outputs.changed_titles }}"
          if [ -n "$TITLES" ]; then
            BODY="$TITLES"
          else
            BODY="${{ github.event.head_commit.message }}"
          fi
          curl -s \
            -H "Title: 部落格已更新 🚀" \
            -H "Tags: white_check_mark" \
            -H "Click: https://bargisula.github.io" \
            --data-raw "$BODY" \
            ntfy.sh/my-blog-notify

      - name: Notify LINE Group
        if: ${{ needs.build.outputs.line_payload != '' }}
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          LINE_MSG: ${{ needs.build.outputs.line_payload }}
        run: |
          python3 - <<'PYEOF'
          import os, json
          from urllib import request, error

          token = os.environ["LINE_TOKEN"]
          group_id = os.environ["LINE_GROUP_ID"]
          message = os.environ["LINE_MSG"].strip()

          if not message or not token or not group_id:
              print("LINE secrets not configured, skipping.")
              exit(0)

          payload = json.dumps({
              "to": group_id,
              "messages": [{"type": "text", "text": message}]
          }).encode()

          req = request.Request(
              "https://api.line.me/v2/bot/message/push",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          try:
              resp = request.urlopen(req)
              print(f"LINE sent: {resp.status}")
          except error.HTTPError as e:
              print(f"LINE error {e.code}: {e.read().decode()}")
              exit(1)
          PYEOF
