name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed_titles: ${{ steps.changed-titles.outputs.titles }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Extract titles from changed content files
        id: changed-titles
        run: |
          TITLES=""
          while IFS= read -r file; do
            if [[ "$file" =~ \.(md|mdx)$ ]] && [ -f "$file" ]; then
              TITLE=$(grep -m1 "^title:" "$file" | sed "s/^title: *//" | tr -d "\"'")
              if [ -n "$TITLE" ]; then
                TITLES="${TITLES}• ${TITLE}"$'\n'
              fi
            fi
          done < <(git diff --name-only HEAD~1 HEAD)
          {
            echo "titles<<EOF"
            printf "%s" "$TITLES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Astro
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify via ntfy
        run: |
          TITLES="${{ needs.build.outputs.changed_titles }}"
          if [ -n "$TITLES" ]; then
            BODY="$TITLES"
          else
            BODY="${{ github.event.head_commit.message }}"
          fi
          curl -s \
            -H "Title: 部落格已更新 🚀" \
            -H "Tags: white_check_mark" \
            -H "Click: https://bargisula.github.io" \
            --data-raw "$BODY" \
            ntfy.sh/my-blog-notify
