name: Update Market Data

on:
  schedule:
    # 22:00 UTC = 台灣 06:00，只跑週一到週五
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # 支援手動觸發（測試用）

permissions:
  contents: write   # 允許 push 回 repo（觸發 deploy workflow）

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch market data
        run: python scripts/fetch_market.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/market.json
          # 只有真正有更動才 commit（避免空 commit）
          if git diff --staged --quiet; then
            echo "No changes to market.json, skipping commit."
          else
            git commit -m "chore: update market data $(date -u '+%Y-%m-%d')"
            git push
          fi
